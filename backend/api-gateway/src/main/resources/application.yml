server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # lb:// = resolve the service through Eureka and load-balance between its instances
          routes:
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/catalog/**
            # OpenAPI description of each service, consumed by the Swagger UI below
            - id: catalog-service-docs
              uri: lb://catalog-service
              predicates:
                - Path=/docs/catalog-service/v3/api-docs
              filters:
                - RewritePath=/docs/catalog-service/v3/api-docs, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same validation as the services: Keycloak realm issuer + audience la3bakbira-api
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/la3bakbira}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/la3bakbira/protocol/openid-connect/certs}
          audiences: la3bakbira-api

# Single Swagger UI for all services: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: catalog-service
        url: /docs/catalog-service/v3/api-docs
    # "Authorize" button: Keycloak login (authorization code + PKCE) with the public Swagger client
    oauth:
      client-id: la3bakbira-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
    persist-authorization: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    # The gateway endpoint (lists routes) is off by default; read-only = view, no changes
    gateway:
      access: read-only
