server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # This is the registry itself: it must not register with / fetch from another Eureka
    register-with-eureka: false
    fetch-registry: false
  server:
    # Faster feedback in development; reconsider for production
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
