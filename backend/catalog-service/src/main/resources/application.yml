server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    # Development defaults match infra/docker/.env.example; override via environment in other envs
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:la3bakbira}
    password: ${DB_PASSWORD:la3bakbira}
  jpa:
    open-in-view: false
    hibernate:
      # Schema generated from the entities during early development
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must come from this Keycloak realm ("iss") and be meant for our API ("aud")
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/la3bakbira}
          # Where signing keys are fetched; may differ from issuer inside Docker/Kubernetes
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/la3bakbira/protocol/openid-connect/certs}
          audiences: la3bakbira-api

app:
  openapi:
    # Public Keycloak realm URL used by Swagger UI's "Authorize" button
    oauth2-realm-url: ${KEYCLOAK_PUBLIC_REALM_URL:http://localhost:8180/realms/la3bakbira}

springdoc:
  # Only the JSON description is served here; Swagger UI lives on the gateway
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
