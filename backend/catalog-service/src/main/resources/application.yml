server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    # Development defaults match infra/docker/.env.example; override via environment in other envs
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USERNAME:la3bakbira}
    password: ${DB_PASSWORD:la3bakbira}
  jpa:
    open-in-view: false
    hibernate:
      # Schema generated from the entities during early development
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true

springdoc:
  # Only the JSON description is served here; Swagger UI lives on the gateway
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
