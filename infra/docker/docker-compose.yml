# Local development infrastructure.
# Usage (from infra/docker):  docker compose up -d
name: la3bakbira

services:
  postgres:
    image: postgres:16-alpine
    container_name: la3bakbira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-la3bakbira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-la3bakbira}
      POSTGRES_DB: postgres
    ports:
      # Host port 5433 by default (5432 is often taken by a locally installed PostgreSQL)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: la3bakbira-keycloak
    restart: unless-stopped
    # start-dev: HTTP allowed, no build step. --import-realm loads ./keycloak/*.json if the realm doesn't exist yet
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-la3bakbira}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-la3bakbira}
      # Public URL used in tokens ("iss" claim) and redirects
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      # Containers may call Keycloak by its internal name (http://keycloak:8080)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
