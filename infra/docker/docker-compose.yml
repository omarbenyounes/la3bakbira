# Local development infrastructure.
# Usage (from infra/docker):  docker compose up -d
name: la3bakbira

services:
  postgres:
    image: postgres:16-alpine
    container_name: la3bakbira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-la3bakbira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-la3bakbira}
      POSTGRES_DB: postgres
    ports:
      # Host port 5433 by default (5432 is often taken by a locally installed PostgreSQL)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
